<!DOCTYPE html>

<head></head>

<body>
  <script>
    function minMax(nums) {

      const result = {
        max: null,
        min: null
      };

      for (let i = 0; i < nums.length; i++) {
        if (nums[i] > result.max || result.max === null) {
          result.max = nums[i];
        }

        if (nums[i] < result.min || result.min === null) {
          result.min = nums[i];
        }
      }
      return result;
    }
    console.log(minMax([]));
    console.log(minMax([3]));
  </script>
</body>

</html>
