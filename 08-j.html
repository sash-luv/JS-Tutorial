<!DOCTYPE html>
<html>
  <head></head>
  <body>
    <button onclick = "
      guessPlayer('heads');
      " >heads</button>

    <button onclick="
      guessPlayer('tails');
    ">tails</button>

    <script>
      let score = {
        wins: 0,
        losses: 0
      };

      function guessPlayer (guess) {
        // the result is the computers guess
      const randomNumber = Math.random();
      const result = randomNumber < 0.5 ? 'heads' : 'tails';

      // compare with the players guess
      console.log(guess === result ? 'You win!' : 'You lose!');

      if (guess === result) {
        score.wins++;
      } else {
        score.losses++;
      }
      console.log(`wins: ${score.wins}, losses: ${score.losses}`)
      }
    </script>
  </body>
</html>
