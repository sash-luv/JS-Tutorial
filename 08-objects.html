<!DOCTYPE html>
<html>
  <head>
    <title>Objects</title>
    <!-- object groups multiple values together -->
  </head>
  <body>
    <script>
      /*
      const product = {
        name: 'socks',
        price: 1090
      };
      console.log(typeof product);
      console.log(product.name);
      console.log(product.price);

      // change a property value
      product.name = 'cotton socks';
      console.log(product.name);
      
      // add a new property value
      product.newproperty = true;
      console.log(product);
      
      delete product.name;
      console.log(product);
*/
      const product2 = {
        name: 'shirt',
        ['delivery-time']: '1day',  // the brackets are not necessery

        rating: {  // nested objects
          stars: 4.5,
          count: 87
        },
        
        fun: function function1() {
          console.log('function inside object');
        }
      };

      console.log(product2);
      console.log(product2['name ']);
      console.log(product2.rating.stars);
      product2.fun();

      // example for a method
      console.log(typeof console);  // is an object
      console.log(typeof console.log);  // is a function


      // JSON
      // when sending between computers in a different language
      // JSON does not support functions

      console.log(JSON.stringify(product2));  // convert js into JSON

      const jsonString = JSON.stringify(product2);
      console.log(JSON.parse(jsonString));  // convert JSON into js


      console.log('hello'.length);
      console.log('hello'.toUpperCase());

      const object1 = {
        message: 'bob'
      };

      const object2 = object1;

      object1.message = 'lala';
      console.log(object1);   // even though we use const we can change the context inside the object

      const object3 = {
        message: 'lala'
      };

      console.log(object3 === object1);  //objects are references, this compares references not the context inside the object

      console.log(object2 === object1);  // this comes as true because the references are same


      const object4 = {
        message: 'lala',
        price: 799
      };

      // const message = object4.message;
      const {message, price} = object4; // destructuring - take the message and save it in a variable with the same name
      console.log(message);
      console.log(price);


      const object5 = {
        // message: message
        message,      // short hand property
        // method: function function1() {
        //   console.log('method');
        // }
        method() {               // short hand method syntax
          console.log('method');
        }
      };
      console.log(object5);
      object5.method();

    </script>
  </body>
</html>
