<!DOCTYPE html>
<html>
  <head>
    <title>DOM Projects</title>

    <style>
      body {
        font-family: arial;
      }

      .subscribe-button {
        border: none;
        color: white;
        background-color: black;
        border-radius: 50px;
        padding: 10px 15px 10px 15px;
        font-weight: bold;
        cursor: pointer;
        margin-bottom: 30px;
      }

      .is-subscribed {
        background-color: rgb(240, 240, 240);
        color: black;
      }

      .js-cost-input {
        font-size: 15px;
        padding: 10px;
      }

      .calculate-button {
        background-color: green;
        color: white;
        border: none;
        font-size: 15px;
        padding: 12px 15px;  /* first vertical second horizontal*/
        cursor: pointer;
      }

      .line {
        color: red;
      }
    </style>
  </head>

  <body>
    <p>Amazon Shipping Calculator</p>
    <p>Orders under $40 = +$10 shipping</p>
    <p>Orders over $40 = FREE shipping</p>

    <input placeholder="Cost of order"
    class="js-cost-input"
    onkeydown="handleCostKeydown(event)"
    onkeyup="
    error_msg();
    ">
    <!-- input is a void element, does not require a closing tag -->

    <button class="calculate-button" onclick="
      calculateTotal();
    ">Calculate</button>

    <p class="line"></p>
    <p class="js-total-cost"></p>

    <script>
      function handleCostKeydown(event) {
        if (event.key === 'Enter') {
        calculateTotal();
        }
      }

      function calculateTotal() {
        const inputElement = document.querySelector('.js-cost-input');

        //save the value from the input
        // Number - .value saves as a string, so convert back to a number
        let cost = Number(inputElement.value);
        if (cost < 40) {
          cost = cost + 10;
        }
        document.querySelector('.js-total-cost')
          .innerHTML= `$${cost}`;
      }

      function error_msg() {
        if(document.querySelector('.js-cost-input').value < 0) {
          document.querySelector('.line').innerHTML = 'Error: cost cannot be less than $0';
        }else{
          document.querySelector('.line').innerHTML = '';
        }
      }
    </script>

  </body>
</html>
