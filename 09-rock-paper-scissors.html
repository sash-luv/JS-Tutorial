<!DOCTYPE html>
<html>

<head>
  <title>Rock Paper Scissors</title>
</head>

<body>
  <p>Rock Paper Scissors</p>

  <button onclick="
    playGame('Rock');
  ">Rock</button>

  <button onclick="
    playGame('Paper');
  ">Paper</button>

  <button onclick="
    playGame('Scissors');
  ">Scissors</button>

  <p class="js-score"></p>
  <p class ="js-result" ></p>
  <p class ="js-moves" ></p>

  <button onclick="
    score.wins = 0;
    score.losses = 0;
    score.ties = 0;
    localStorage.removeItem('score');

    updateScoreElement();  // to update it as 0
  ">Reset Score
  </button>

  <script>
    let score = JSON.parse(localStorage.getItem('score'));
    if (score === null) {  // !score can also be applied, null is a falsy value
      score = {
        wins: 0,
        losses: 0,
        ties: 0
      }
    }

    updateScoreElement();  // to make it first appear in the page
    
    function playGame(playerMove) {
      const computerMove = pickComputerMove();
      let result = '';

      if (playerMove === 'Scissors') {
        if (computerMove === 'Rock') {
          result = 'You lose.';
        } else if (computerMove === 'Paper') {
          result = 'You win.';
        } else if (computerMove === 'Scissors') {
          result = 'Tie.';
        }

      } else if (playerMove === 'Paper') {
        if (computerMove === 'Rock') {
          result = 'You win.';
        } else if (computerMove === 'Paper') {
          result = 'Tie.';
        } else if (computerMove === 'Scissors') {
          result = 'You lose.';
        }

      } else if (playerMove === 'Rock') {
        if (computerMove === 'Rock') {
          result = 'Tie.';
        } else if (computerMove === 'Paper') {
          result = 'You lose.';
        } else if (computerMove === 'Scissors') {
          result = 'You win.';
        }
      }

      if (result === 'You win.') {
        score.wins++;
      } else if (result === 'You lose.') {
        score.losses++;
      } else if(result === 'Tie.'){
        score.ties++;
      }

      localStorage.setItem('score', JSON.stringify(score));

      updateScoreElement(); // to update as the game plays
      
      document.querySelector('.js-result')
        .innerHTML = result;
    
      document.querySelector('.js-moves')
      .innerHTML = `You ${playerMove} - ${computerMove} Computer`;
    }

    function updateScoreElement() {
      document.querySelector('.js-score')
        .innerHTML = `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`;
    }


    function pickComputerMove() {
      const randomNum = Math.random();
      let computerMove = '';

      if (randomNum >= 0 && randomNum < 1 / 3) {
        computerMove = 'Rock';
      } else if (randomNum >= 1 / 3 && randomNum < 2 / 3) {
        computerMove = 'Paper';
      } else if (randomNum >= 2 / 3 && randomNum <= 1) {
        computerMove = 'Scissors';
      }
      return computerMove;
    }
  </script>
</body>

</html>

<!-- Scope- when creating a variable inside {} the variable is only limited to inside the {} -->
