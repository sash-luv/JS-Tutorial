<!DOCTYPE html>
<html>

<head>
  <title>Rock Paper Scissors</title>
</head>

<body>
  <p>Rock Paper Scissors</p>

  <button onclick="
 // computerMove = pickComputerMove();
    playGame('Rock');
  ">Rock</button>

  <button onclick="
 // computerMove = pickComputerMove();
    playGame('Paper');
  ">Paper</button>

  <button onclick="
    // computerMove = pickComputerMove();
    playGame('Scissors');
  ">Scissors</button>

  <button onclick="
    score.wins = 0;
    score.losses = 0;
    score.ties = 0;

    localStorage.removeItem('score');  // remove the stored values
    alert(`Score has been reset.`)

  ">Reset Score
  </button>

  <script>
    // const score = {
    //   wins: 0,
    //   losses: 0,
    //   ties: 0
    // }

    console.log(localStorage.getItem('message'));


    // convert JSON back to an object
    let score = JSON.parse(localStorage.getItem('score'));

    if (score === null) {  // !score can also be applied, null is a falsy value
      score = {
        wins: 0,
        losses: 0,
        ties: 0
      }
    }
    

    function playGame(playerMove) {
    let result = '';

      const computerMove = pickComputerMove();

      if (playerMove === 'Scissors') {
        if (computerMove === 'Rock') {
          result = 'You lose.';
        } else if (computerMove === 'Paper') {
          result = 'You win.';
        } else if (computerMove === 'Scissors') {
          result = 'Tie.';
        }

      } else if (playerMove === 'Paper') {
        if (computerMove === 'Rock') {
          result = 'You win.';
        } else if (computerMove === 'Paper') {
          result = 'Tie.';
        } else if (computerMove === 'Scissors') {
          result = 'You lose.';
        }

      } else if (playerMove === 'Rock') {
        if (computerMove === 'Rock') {
          result = 'Tie.';
        } else if (computerMove === 'Paper') {
          result = 'You lose.';
        } else if (computerMove === 'Scissors') {
          result = 'You win.';
        }
      }

      if (result === 'You win.') {
        score.wins++;
      } else if (result === 'You lose.') {
        score.losses++;
      } else if(result === 'Tie.'){
        score.ties++;
      }

      localStorage.setItem('message', 'hello');  // to store a value even if page is refreshed

      // convert js into string, localStorage only supports string
      // localStorage.setItem('score', score);   // second score is score object
      JSON.stringify(score);

      localStorage.setItem('score', JSON.stringify(score));
    


      alert(`You picked ${playerMove}. Computer picked ${computerMove}. ${result}\nWins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}.`);
    }

    function pickComputerMove() {
      const randomNum = Math.random();
      let computerMove = '';

      if (randomNum >= 0 && randomNum < 1 / 3) {
        computerMove = 'Rock';
      } else if (randomNum >= 1 / 3 && randomNum < 2 / 3) {
        computerMove = 'Paper';
      } else if (randomNum >= 2 / 3 && randomNum <= 1) {
        computerMove = 'Scissors';
      }

      return computerMove;
    }
  </script>
</body>

</html>

<!-- Scope- when creating a variable inside {} the variable is only limited to inside the {} -->
