<!DOCTYPE html>
<html>
  <head>
    <title>DOM Projects</title>

    <style>
      body {
        font-family: arial;
      }

      .subscribe-button {
        border: none;
        color: white;
        background-color: black;
        border-radius: 50px;
        padding: 10px 15px 10px 15px;
        font-weight: bold;
        cursor: pointer;
        margin-bottom: 30px;
      }

      .is-subscribed {
        background-color: rgb(240, 240, 240);
        color: black;
      }

      .js-cost-input {
        font-size: 15px;
        padding: 10px;
      }

      .calculate-button {
        background-color: green;
        color: white;
        border: none;
        font-size: 15px;
        padding: 12px 15px;  /* first vertical second horizontal*/
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <p>YouTube Subscribe Button</p>
    <button class ="subscribe-button" onclick="
      subscribe();
    " >Subscribe</button>
    
    <p>Amazon Shipping Calculator</p>
    <p>Orders under $40 = +$10 shipping</p>
    <p>Orders over $40 = FREE shipping</p>

    <input placeholder="Cost of order"
    class="js-cost-input"
    onkeydown="handleCostKeydown(event)">
    <!-- input is a void element, does not require a closing tag -->

    <button class="calculate-button" onclick="
      calculateTotal();
    ">Calculate</button>

    <p class="js-total-cost"></p>

    <script>
      String(25);  //convert num into a string
      console.log('25' - 5);   // Type coercion - result 20
      console.log('25' + 5);  // result - 255

      window.console
      window.alert
      // window is a built in object that represents window, no need to add it the browser adds it automaticaly

      function handleCostKeydown(event) {
        if (event.key === 'Enter') {
        calculateTotal();
      }
      }

      function calculateTotal() {
        const inputElement = document.querySelector('.js-cost-input');

        //save the value from the input
        // Number - .value saves as a string, so convert back to a number
        let cost = Number(inputElement.value);
        if (cost < 40) {
          cost = cost + 10;
        }
        document.querySelector('.js-total-cost')
          .innerHTML= `$${cost}`;
      }

      function subscribe () {
        const buttonElement = document.querySelector('.subscribe-button');
        if (buttonElement.innerHTML === 'Subscribe') {
          buttonElement.innerHTML = 'Subscribed';
          buttonElement.classList.add('is-subscribed');  // adds a class to the button when clicked
        } else {
          buttonElement.innerHTML = 'Subscribe';
          buttonElement.classList.remove('is-subscribed')   // remove the added class
        }
      /* if there is extra spaces inside the button, use innerText this, then it will only focus on the text only */
      }
    </script>

  </body>
</html>
