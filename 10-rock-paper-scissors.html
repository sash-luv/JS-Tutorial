<!DOCTYPE html>
<html>

<head>
  <title>Rock Paper Scissors</title>

  <link rel="stylesheet" href="styles/10-rock-paper-scissors.css"> 
</head>

<body>
  <p class="title" >Rock Paper Scissors</p>

  <button class="move-button" onclick="
    playGame('Rock');
  "> <img src="images/rock-emoji.png" class="move-icon"></button>

  <button class="move-button" onclick="
    playGame('Paper');
  "><img src="images/paper-emoji.png" class="move-icon"></button>

  <button class="move-button" onclick="
    playGame('Scissors');
  "> <img src="images/scissors-emoji.png" class="move-icon"></button>

  <p class ="js-result" ></p>
  <p class ="js-moves"></p>
  <p class="js-score"></p>

  <button class="reset-score-button" onclick="
    score.wins = 0;
    score.losses = 0;
    score.ties = 0;
    localStorage.removeItem('score');

    updateScoreElement();  // to update it as 0
  ">Reset Score
  </button>

  <script src="scripts/10-rock-paper-scissors.js" ></script>
</body>

</html>

<!-- Scope- when creating a variable inside {} the variable is only limited to inside the {} -->
